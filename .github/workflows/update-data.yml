
name: Actualizar datos de Kworb

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recopilar estadísticas públicas de Kworb
        run: python scripts/fetch_kworb.py

      - name: Guardar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spotify-songs.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de charts"
            git push
          else
            echo "No hay cambios en los datos."
          fi
          
