name: Actualizar datos de charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Actualizar datos de Spotify desde Kworb
        run: python scripts/fetch_kworb.py

      - name: Actualizar vistas de YouTube
        if: ${{ env.YOUTUBE_API_KEY != '' }}
        run: python scripts/fetch_youtube.py

      - name: Avisar si falta la clave de YouTube
        if: ${{ env.YOUTUBE_API_KEY == '' }}
        run: echo "YOUTUBE_API_KEY no está configurada; se conservan los últimos datos de YouTube disponibles."

      - name: Actualizar chart mundial de iTunes
        run: python scripts/fetch_itunes.py

      - name: Validar archivos y estructura de datos
        run: python scripts/validate_data.py

      - name: Guardar historial central de charts
        run: python scripts/snapshot_history.py

      - name: Guardar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spotify-songs.json data/youtube-charts.json data/itunes-charts.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar charts e historial diario"
            git push
          else
            echo "No hay cambios en los datos."
          fi
